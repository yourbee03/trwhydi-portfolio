      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="690" cy="130" r="140" fill="#ffffff" opacity="0.08"/>
  <circle cx="100" cy="700" r="170" fill="#ffffff" opacity="0.06"/>
  <!-- code window -->
