<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#e0f7f7"/>
    </linearGradient>
    <pattern id="stripes" width="26" height="26" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="13" height="26" fill="#2bb3b1"/>
      <rect x="13" width="13" height="26" fill="#ffffff"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="90" cy="110" r="120" fill="#2bb3b1" opacity="0.10"/>
  <circle cx="720" cy="700" r="150" fill="#f5b93f" opacity="0.12"/>
  <rect x="0" y="742" width="800" height="58" fill="url(#stripes)" opacity="0.35"/>
  <!-- consultation chat bubble -->
  <g>
    <path d="M268 190 h264 a42 42 0 0 1 42 42 v104 a42 42 0 0 1 -42 42 H398 l-66 58 v-58 h-64 a42 42 0 0 1 -42 -42 V232 a42 42 0 0 1 42 -42 z" fill="#2bb3b1"/>
    <!-- medical cross -->
    <path d="M382 240 h36 v34 h34 v36 h-34 v34 h-36 v-34 h-34 v-36 h34 z" fill="#ffffff"/>
    <!-- chat lines -->
    <rect x="478" y="262" width="52" height="14" rx="7" fill="#ffffff" opacity="0.75"/>
    <rect x="478" y="292" width="36" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- pill capsule -->
  <g transform="rotate(38 616 226)">
    <rect x="556" y="196" width="120" height="58" rx="29" fill="#f5b93f"/>
    <path d="M616 196 h31 a29 29 0 0 1 0 58 h-31 z" fill="#ffffff"/>
    <rect x="610" y="196" width="12" height="58" fill="#e5e7eb" opacity="0.6"/>
  </g>
  <circle cx="196" cy="330" r="17" fill="#f5b93f"/>
  <circle cx="640" cy="356" r="13" fill="#2bb3b1" opacity="0.65"/>
  <circle cx="586" cy="410" r="9" fill="#f5b93f" opacity="0.8"/>
  <!-- wordmark -->
  <text x="400" y="540" font-family="Verdana, sans-serif" font-size="86" font-weight="bold" text-anchor="middle" letter-spacing="1"><tspan fill="#f5b93f">Apo</tspan><tspan fill="#2bb3b1">Kaba</tspan><tspan fill="#f5b93f">.com</tspan></text>
  <text x="400" y="592" font-family="Verdana, sans-serif" font-size="25" fill="#075985" text-anchor="middle" letter-spacing="5">RSUD TUANKU IMAM BONJOL</text>
  <text x="400" y="676" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#0e7490" text-anchor="middle" letter-spacing="3">KONSULTASI OBAT &amp; EDUKASI APOTEKER</text>
  <text x="400" y="712" font-family="Verdana, sans-serif" font-size="21" fill="#64748b" text-anchor="middle" font-style="italic">Tanya obat lebih mudah, gunakan obat lebih aman</text>
</svg>
